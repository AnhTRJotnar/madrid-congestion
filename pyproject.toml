[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "madrid_congestion"
version = "0.0.1"
description = "Advanced project - RUC"
authors = [
  { name = "Anh Tran" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "python-dotenv",
    "requests>=2.34.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["madrid_congestion"]
include = ["pyproject.toml", "madrid_congestion/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["madrid_congestion"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# fecha is naive Madrid clock time; DST_ROWS must match it, so no tzinfo
"madrid_congestion/config.py" = ["DTZ001"]
"tests/test_districts.py" = ["DTZ001"] # test rows mirror the naive fecha

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

